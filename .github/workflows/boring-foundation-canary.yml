name: Boring Foundation Canary Audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform upgrader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: upgrader

      - name: Checkout coding-tooling authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/coding-tooling
          path: coding-tooling
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build platform upgrader
        working-directory: upgrader
        run: |
          bun install --no-save
          bun run build

      - name: Checkout rect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/rect
          path: fleet/rect
          persist-credentials: false

      - name: Checkout ecs-lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/ecs-lab
          path: fleet/ecs-lab
          persist-credentials: false

      - name: Checkout shader-lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/shader-lab
          path: fleet/shader-lab
          persist-credentials: false

      - name: Checkout moenarch-foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/moenarch-foundation
          path: fleet/moenarch-foundation
          persist-credentials: false

      - name: Checkout audio-analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/audio-analysis
          path: fleet/audio-analysis
          persist-credentials: false

      - name: Checkout ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/ui
          path: fleet/ui
          persist-credentials: false

      - name: Checkout rust-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/rust-packages
          path: fleet/rust-packages
          persist-credentials: false

      - name: Checkout nlp-stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/nlp-stack
          path: fleet/nlp-stack
          persist-credentials: false

      - name: Audit canary fleet through coding-tooling authority
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boring-foundation-canary"
          node upgrader/dist/cli.js rollout plan boring-foundation-v1 "$GITHUB_WORKSPACE/fleet" \
            --report "$RUNNER_TEMP/boring-foundation-canary/report.json" \
            --coding-tooling-root "$GITHUB_WORKSPACE/coding-tooling"
          cat "$RUNNER_TEMP/boring-foundation-canary/report.json"
          {
            echo '## Boring foundation canary audit'
            echo
            echo 'Authority: `coding-tooling foundation audit`'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/boring-foundation-canary/report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boring-foundation-canary
          path: ${{ runner.temp }}/boring-foundation-canary/report.json
          retention-days: 7
