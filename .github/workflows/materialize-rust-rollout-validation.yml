name: Materialize Rust Rollout Validation Fix

on:
  push:
    branches:
      - fix/rust-rollout-validation-without-lockfile

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Apply narrow rollout validation fix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const rolloutPath = 'src/rollout.ts';
          let rollout = fs.readFileSync(rolloutPath, 'utf8');
          const oldCargo = `  if (existsSync(path.join(repoRoot, "Cargo.toml"))) {\n    return { command: "cargo test --locked", source: "cargo" };\n  }`;
          const newCargo = `  if (existsSync(path.join(repoRoot, "Cargo.toml"))) {\n    const lockfilePresent = existsSync(path.join(repoRoot, "Cargo.lock"));\n    return {\n      command: lockfilePresent ? "cargo test --locked" : "cargo test",\n      source: "cargo",\n    };\n  }`;
          if (!rollout.includes(oldCargo)) throw new Error('Expected Cargo validation fallback not found');
          rollout = rollout.replace(oldCargo, newCargo);
          fs.writeFileSync(rolloutPath, rollout);

          const testPath = 'tests/rollout.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const oldImport = `  recordRolloutResult,\n  repositoryGitState,\n  writeRolloutReport,`;
          const newImport = `  recordRolloutResult,\n  repositoryGitState,\n  repositoryValidationCommand,\n  writeRolloutReport,`;
          if (!tests.includes(oldImport)) throw new Error('Expected rollout import block not found');
          tests = tests.replace(oldImport, newImport);

          const marker = `  test("resumes an accepted repository only while the audited revision is unchanged", () => {`;
          const regression = `  test("uses Cargo locking only when the repository commits a lockfile", () => {\n    const fleet = fixture();\n    const repoRoot = path.join(fleet, "rust-workspace");\n    mkdirSync(repoRoot, { recursive: true });\n    writeFileSync(path.join(repoRoot, "Cargo.toml"), '[workspace]\\nresolver = "2"\\n');\n\n    expect(repositoryValidationCommand(repoRoot)).toEqual({\n      command: "cargo test",\n      source: "cargo",\n    });\n\n    writeFileSync(path.join(repoRoot, "Cargo.lock"), "version = 4\\n");\n    expect(repositoryValidationCommand(repoRoot)).toEqual({\n      command: "cargo test --locked",\n      source: "cargo",\n    });\n  });\n\n`;
          if (!tests.includes(marker)) throw new Error('Expected rollout test insertion point not found');
          tests = tests.replace(marker, regression + marker);
          fs.writeFileSync(testPath, tests);
          NODE

      - name: Validate focused rollout behavior
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          bun test tests/rollout.test.js

      - name: Commit durable fix and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-rust-rollout-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rollout.ts tests/rollout.test.js .github/workflows/materialize-rust-rollout-validation.yml
          git diff --cached --exit-code && {
            echo 'Expected rollout validation changes, but branch is already current.' >&2
            exit 1
          }
          git commit -m 'fix: respect Rust workspaces without lockfiles'
          git push origin HEAD:fix/rust-rollout-validation-without-lockfile
