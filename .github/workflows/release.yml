name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-template.yml@scaffold-v2-release-auth
    with:
      validate_command: bun run test
      release_type: package
      release_command: bun run release:publish
