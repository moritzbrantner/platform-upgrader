name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-template.yml@scaffold-v2-release-auth
    with:
      bun_version: 1.4.0
      install_command: bun install --no-save
      validate_command: bun run check
      release_type: package
      release_command: bun run release:publish
