name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      validate-boring-foundation-canary: ${{ steps.scope.outputs.validate-boring-foundation-canary }}
      validate-boring-foundation-fleet: ${{ steps.scope.outputs.validate-boring-foundation-fleet }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess
          scopes = {'validate-boring-foundation-canary': {'paths': ['.github/workflows/boring-foundation-canary.yml', 'src/cli.js', 'src/cli.ts', 'src/environment.js', 'src/environment.ts', 'src/foundation.js', 'src/foundation.ts', 'src/foundation-authority.js', 'src/foundation-authority.ts', 'src/rollout.js', 'src/rollout.ts', 'tests/environment.test.js', 'tests/foundation.test.js', 'tests/foundation-authority.test.js', 'tests/rollout.test.js', '.github/workflows/validate.yml'], 'branches': []}, 'validate-boring-foundation-fleet': {'paths': ['.github/fleet/repository-lifecycle.json', '.github/workflows/boring-foundation-fleet.yml', '.github/workflows/validate.yml'], 'branches': []}}
          selected = {job: False for job in scopes}
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as source:
                  pull_request = json.load(source)["pull_request"]
              revision = pull_request["base"]["sha"] + "..." + pull_request["head"]["sha"]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", revision]).decode().split("\0")
              selected = {
                  job: (not rule["paths"] or any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in rule["paths"]))
                  and (not rule["branches"] or any(fnmatch.fnmatchcase(pull_request["base"]["ref"], branch) for branch in rule["branches"]))
                  for job, rule in scopes.items()
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print(f"allow-skipped={json.dumps([job for job, active in selected.items() if not active])}", file=output)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: bun-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --no-save
      - run: bun run check

  findings:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@6fdaed0e0b99da476ccc0cad545882fea93eda01 # main
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json

  validate-boring-foundation-canary:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-boring-foundation-canary == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/boring-foundation-canary.yml

  validate-boring-foundation-fleet:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-boring-foundation-fleet == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/boring-foundation-fleet.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["test", "validate-boring-foundation-canary", "validate-boring-foundation-fleet", "validation-scope"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["test", "validate-boring-foundation-canary", "validate-boring-foundation-fleet", "validation-scope"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
