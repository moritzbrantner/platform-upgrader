name: Validate

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - id: bun-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --no-save
      - run: bun run lint && bun run typecheck && bun run test
      - run: bun run format
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet -- src/*.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/*.ts
          git commit -m "style: apply TypeScript formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  findings:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@10d3ac3c0754cf075a43f17dcc3c84d1967d3061
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json
