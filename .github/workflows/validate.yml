name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: bun-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --no-save
      - run: bun run check

  findings:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@5e4c334179c59bbc4a4768bf033ff1d27cd89c0c # main
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json
