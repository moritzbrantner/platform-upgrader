name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - id: bun-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --no-save
      - run: bun run lint && bun run typecheck && bun run test
      - run: bun run format
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-typescript
          path: src/*.ts

  findings:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@10d3ac3c0754cf075a43f17dcc3c84d1967d3061
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json
